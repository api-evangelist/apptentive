securityDefinitions:
  ApiKeyAuth:
    type: apiKey
    name: X-API-KEY
    in: header

definitions:
  RatingDialogResponse:
    type: object
    properties:
      app_id:
        type: string
        description: apptentive's application identifier
        example: 5e22085d5379215be800002b
      start_date:
        type: string
        description: the start date representation in YYYY-MM-DD format
        example: 2022-05-17
      end_date:
        type: string
        description: the end date representation in YYYY-MM-DD format
        example: 2022-06-17
      rating_opportunities:
        type: object
        properties:
          opportunites:
            type: number
            description: the number of rating opportunities
            example: 236993
          via_in_app_dialog:
            type: number
            description: opportunities via in app dialog
            example: 236293
          via_apptentive_rate_action:
            type: number
            description: opportunities via apptentive rate action
            example: 700
      in_app_rating_dialogs:
        type: object
        properties:
          dialog_views:
            type: number
            description: the number of dialog rating views
            example: 36076
          not_shown:
            type: number
            description: the number of not shown rating views
            example: 46346
          alt_dialog:
            type: number
            description: alternative dialog number
            example: 2523
      apptentive_rating_dialogs:
        type: object
        properties:
          rated:
            type: number
            description: the number of apptentive rated dialog views
            example: 23423
          remind_me:
            type: number
            description: the number of apptentive remind me later dialog views
            example: 342
          no_thanks:
            type: number
            description: the number of apptentive declined dialog views
            example: 15
      data:
        type: array
        items:
          $ref: "#/definitions/DialogTimeseries"

  DialogTimeseries:
    type: object
    properties:
      date:
        type: string
        description: the start date representation in YYYY-MM-DD format
        example: 2022-05-17
      dialog_views:
        type: number
        description: the amount of dialog views
        example: 100
      not_shown:
        type: number
        description: the amount of not shown views
        example: 200
      alt_dialog:
        type: number
        description: the amount of alt dialog views
        example: 300
      apptentive_rated:
        type: number
        description: the amount of apptentive rated views
        example: 400
      apptentive_remind_me:
        type: number
        description: the amount of apptentive remind me views
        example: 500
      apptentive_no_thanks:
        type: number
        description: the amount of apptentive no thanks views
        example: 500

  ReachSDKResponse:
    type: object
    properties:
      app_id:
        type: string
        description: apptentive's application identifier
        example: 5e22085d5379215be800002b
      start_date:
        type: string
        description: the start date representation in YYYY-MM-DD format
        example: 2022-05-17
      end_date:
        type: string
        description: the end date representation in YYYY-MM-DD format
        example: 2022-06-17
      total_mau:
        type: integer
        description: number of total monthly active users
        example: 41674096
      sdk_versions:
        $ref: "#/definitions/SDKVersionArray"

  SDKVersionArray:
    type: array
    items:
      $ref: "#/definitions/SDKVersionObject"

  SDKVersionObject:
    properties:
      version:
        type: string
        description: the version of Apptentive SDK
        example: 6.0.1
      mau_unique:
        type: number
        description: number of unique devices associated with corresponding SDK version
        example: 41255288
      percentage_from_total:
        type: number
        description: the percentage from the total active users (up to 5 floating points)
        example: 98.995


  RollupResponseArray:
    type: "array"
    items:
      $ref: "#/definitions/RollupResponse"

  RollupResponse:
    type: "object"
    properties:
      app_id:
        type: string
        description: apptentive's application identifier
        example: 5e22085d5379215be800002b
      org_id:
        type: string
        description: Apptentive's customer/organization identifier
        example: 5e22085d5379215be800002b
      title:
        type: string
        description: The title of the application specified in the dashboard
        example: App Demo
      platform:
        type: string
        description: the application platform type
        example: iOS, Android, or Web
      store_id:
        type: string
        description: The identifier of the app on iTunes or Google Play
        example: com.company.product (android)
      love_ratio:
        type: string
        description: The percentage of consumers that love the experience
        example: 11%
      active_users:
        type: integer
        description: The number of distinct consumers seen within the last 30 days
        example: 12419
      current_rating:
        type: integer
        description: The current version's rating (iTunes only)
        example: 4.78
      all_rating:
        type: integer
        description: The app's all-time rating across versions
        example: 4.78
      interaction_count:
        type: integer
        description: The count of total Apptentive interaction events see within the timeframe
        example: 404152

  LovePercentResponse:
    type: "object"
    properties:
      love_percentage:
        type: integer
        description: The percentage of consumers that love the experience
        example: 78
      love_dialog_responses_total:
        type: integer
        description: The number of total Love Dialog responses
        example: 12300
      tapped_love:
        type: integer
        description: The number of yes taps
        example: 12000
      tapped_no:
        type: integer
        description: The number of no taps
        example: 250
      tapped_other_respondents:
        type: integer
        description: The number of cancels (in Android) or non-responses
        example: 10
      love_timeseries:
        $ref: "#/definitions/LoveTimeDataArray"

  LoveTimeDataArray:
    type: "array"
    items:
      $ref: "#/definitions/LoveTimeData"
    description: the list of love timeseries data

  LoveTimeData:
    type: "object"
    properties:
      date:
        type: string
        description: love timeseries date interval (format YYYY-MM-DD)
        example: "2020-01-01"
      tapped_total:
        type: integer
        description: the total amount of tapped responses
        example: 20388
      tapped_love:
        type: integer
        description: The number of yes taps
        example: 15535
      tapped_no:
        type: integer
        description: The number of no taps
      other_respondents:
        type: integer
        description: The number of cancels (in Android) or non-responses

  NotesDataResponse:
    type: "object"
    properties:
      total:
        type: integer
        description: total number of launches
        example: 130000
      notes_timeseries:
        $ref: "#/definitions/NotesTimeDataArray"

  NotesTimeDataArray:
    type: "array"
    items:
      $ref: "#/definitions/NotesTimeData"
    description: the list of notes timeseries data

  NotesTimeData:
    type: "object"
    properties:
      date:
        type: string
        description: love timeseries date interval (format YYYY-MM-DD)
        example: "2020-01-01"
      notes_launches:
        type: integer
        description: the number of notes launches
        example: 120
      notes_dismisses:
        type: integer
        description: the number of notes dismisses
        example: 10
      notes_cancels:
        type: integer
        description: the number of notes cancels
        example: 89
      notes_interactions:
        type: integer
        description: the number of notes interactions
        example: 34

  SurveyDataResponse:
    type: "object"
    properties:
      total:
        type: integer
        example: 12300
      survey_timeseries:
        $ref: "#/definitions/SurveyTimeDataArray"

  SurveyTimeDataArray:
    type: "array"
    items:
      $ref: "#/definitions/SurveyTimeData"
    description: the list of survey timeseries data

  SurveyTimeData:
    type: "object"
    properties:
      date:
        type: string
        description: date representation in format 'YYYY-MM-DD'
        example: 2022-01-01
      survey_launches:
        type: integer
        description: survey launches count
        example: 100
      survey_cancels:
        type: integer
        description: survey cancels count
        example: 9
      survey_submits:
        type: integer
        description: survey submit count
        example: 80
      survey_question_responses:
        type: integer
        description: survey question responses count
        example: 140

  ActiveUserResponse:
    type: "object"
    properties:
      app_id:
        type: string
        description: the app_id in hex representation
        example: 48b5a6247bcb505bc8000020
      start_date:
        type: string
        description: the start date representation in YYYY-MM-DD format
        example: 2022-05-17
      end_date:
        type: string
        description: the end date representation in YYYY-MM-DD format
        example: 2022-06-17
      granularity:
        type: string
        description: selected level of the granularity
        example: all
      data:
        $ref: "#/definitions/ActiveUsersDataArray"

  ActiveUsersDataArray:
    type: "array"
    items:
      $ref: "#/definitions/ActiveUserRow"

  ActiveUserRow:
    type: "object"
    properties:
      date:
        type: string
        description: the date in "YYYY-MM-DD" format
        example: 2022-05-17
      app_launches:
        type: integer
        description: the total amount of application launches
        example: 4541305495
      active_users:
        type: integer
        description: the distinct count of active users
        example: 53282747

  RatingsDataResponse:
    type: "object"
    properties:
      app_id:
        type: string
        description: the hex id representation of the application
        example: 5e22085d5379215be800002b
      org_id:
        type: string
        description: the hex id representation of the organization
        example: 5e22085d5379215be800002b
      public_store_id:
        type: string
        description: id from the public store like iTunes or Android
      platform:
        type: string
        description: platform identifier
        example: android
      ratings:
        $ref: "#/definitions/RatingsDataArray"

  RatingsDataArray:
    type: "array"
    items:
      $ref: "#/definitions/RatingsData"
    description: the list of ratings data

  RatingsData:
    type: "object"
    properties:
      region:
        type: string
        description: application region
        example: US
      date:
        type: string
        description: the date in format of YYYY-MM-DD
        example: 2020-01-01
      all_ratings_average:
        type: number
        description: average ratings all-time
        example: 5
      all_ratings_count:
        type: integer
        description: all ratings count
        example: 13841934
      all_ratings:
        $ref: "#/definitions/RatingRow"
      all_ratings_percents:
        $ref: "#/definitions/RatingRowFloat"
      current_ratings_average:
        type: number
        description: current version average ratings (iOS only)
        example: 5
      current_ratings__count:
        type: integer
        description: current version ratings count (iOS only)
        example: 519923
      current_ratings:
        $ref: "#/definitions/RatingRow"
      version:
        type: string
        example: 6.16.15

  RatingRow:
    type: "object"
    description: rating stats from 1 to 5 (iOS only)
    properties:
      1:
        type: integer
        description: total count for 1-ratings
        example: 12014
      2:
        type: integer
        description: total count of 2-ratings
        example: 188
      3:
        type: integer
        description: total count of 3-ratings
        example: 1349
      4:
        type: integer
        description: total count of 4-ratings
        example: 4504
      5:
        type: integer
        description: total count of 5-ratings
        example: 89013

  RatingRowFloat:
    type: "object"
    description: rating percentage stats from 1 to 5 (Android only)
    properties:
      1:
        type: number
        description: total percentage for 1-ratings
        example: 71.149
      2:
        type: number
        description: total percentage of 2-ratings
        example: 9.053
      3:
        type: number
        description: total percentage of 3-ratings
        example: 1.614
      4:
        type: number
        description: total percentage of 4-ratings
        example: 3.386
      5:
        type: number
        description: total percentage of 5-ratings
        example: 14.529

  RetentionResponse:
    type: "object"
    description: retention response
    properties:
      retention:
        $ref: "#/definitions/RetentionResponseArray"

  RetentionResponseArray:
    type: "array"
    items:
      $ref: "#/definitions/RetentionInternalArray"

  RetentionInternalArray:
    type: "array"
    items:
      $ref: "#/definitions/RetentionInternalRow"

  RetentionInternalRow:
    type: "object"
    properties:
      bucket:
        type: string
        description: retention bucket in date format
        example: "2020-07-01T00:00:00.000Z/2020-07-31T23:59:59.999Z"
      lost:
        type: number
        description: lost number representation
      origin:
        type: string
        description: origin bucket date format representation
        example: 2020-07-01T00:00:00.000Z/2020-07-31T23:59:59.999Z
      percentage:
        type: number
        description: retention percentage
        example: 64.55
      retained:
        type: number
        description: approx. quantative number of retained people
        example: 11140470
      timestamp:
        type: string
        description: time interval of data in timestamp representation
        example: "2020-08-01T00:00:00.000Z"

  FanSignalsCountsArray:
    type: "array"
    items:
      $ref: "#/definitions/FanSignalsCountsRow"
    description: the list of fan signals data

  FanSignalsCountsRow:
    type: "object"
    properties:
      date:
        type: string
      new_fans:
        type: number
        description: the amount of new fans
        example: 1300
      new_risk:
        type: number
        description: the amount of new risk
        example: 355
      repeat_fan:
        type: number
        description: the amount of repeated fans
        example: 400
      repeat_risk:
        type: number
        description: the amount of repeated risk
        example: 33
      shifted_to_fan:
        type: number
        description: the amount of people shifted to fan
        example: 1313
      shifted_to_risk:
        type: number
        description: the amount of people shifted to risk
        example: 22
