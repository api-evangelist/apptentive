  POSTGDPRRequest:
    type: object
    description: GDPR/CCPA create request payload
    properties:
      regulation:
        type: string
        description: string value representing the regulation that this request is covered by
        example: gdpr | ccpa
      subject_request_type:
        type: string
        description: the type of GDPR/CCPA request
        example: erasure | access
      api_version:
        type: string
        description: version string representing the desired version of the OpenDSR API
        example: '2.0'
      extensions:
        type: object
        minProperties: 1
        maxProperties: 1
        description: processor-id-keyed object representing processor-specific elements in the request. In current implementation extensions contain all objects requested for processing. It should contain an internal object called "apptentive.com"
        additionalProperties:
          $ref: '#/definitions/GDPRExtension'
        example:
          apptentive.com:
            org_id: '{org_id}'
            identity_type: email | cid
            identity_value:
            - dart@apptentive.com
            - luke@apptentive.com
            - uuid
            - objectID
            - some_string
            created_by: Dart Vader
  RollupResponseArray:
    type: array
    items:
      $ref: '#/definitions/RollupResponse'
  NotesActionViewArray:
    type: array
    items:
      $ref: '#/definitions/NotesActionView'
