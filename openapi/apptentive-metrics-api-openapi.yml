        type: string
      responses:
        '200':
          description: survey responses data
          schema:
            $ref: '#/definitions/SurveyResponses'
        '400':
          description: bad request
          schema:
            $ref: '#/definitions/ErrorBadRequestResponse'
        '401':
          description: not authorized
          schema:
            $ref: '#/definitions/ErrorUnauthorizedResponse'
        '500':
          description: internal server error
          schema:
            $ref: '#/definitions/ErrorInternalErrorResponse'
  /metrics/v2/apps/{app_id}/survey/insights:
    get:
      tags:
      - metrics
      summary: fetch survey responses
      description: fetch survey responses
      operationId: fetch responses
      consumes:
      - application/json
      produces:
      - application/json
      - application/xml
      - text/csv
      security:
      - ApiKeyAuth: []
      parameters:
      - name: app_id
        in: path
        description: the application id in mongo id format (ex. 5e22085d5379215be800002b)
        required: true
        type: string
      - name: start_date
        in: query
        description: start date in format of YYYY-MM-DD
        required: true
        type: string
      - name: end_date
        in: query
        description: end date in format of YYYY-MM-DD
        required: true
        type: string
      - name: page
        in: query
        description: the page number
        default: 0
        required: false
        type: string
      - name: api_key
        in: query
        description: (optional) you can provide the X-API-KEY as 'api_key' query parameter
        required: false
        type: string
      - name: accept
        in: query
        description: (optional) you can provide the accept header as 'accept' query parameter
        required: false
        type: string
      responses:
        '200':
          description: the reviews response
          schema:
            $ref: '#/definitions/InsightsSurveyResponse'
        '400':
          description: bad request
          schema:
            $ref: '#/definitions/ErrorBadRequestResponse'
        '401':
          description: not authorized
          schema:
            $ref: '#/definitions/ErrorUnauthorizedResponse'
        '500':
          description: internal server error
          schema:
            $ref: '#/definitions/ErrorInternalErrorResponse'
  /metrics/v2/apps/{app_id}/gdpr-ccpa/requests:
    post:
      tags:
      - metrics
      summary: Triggers GDPR/CCPA request
      consumes:
      - application/json
      parameters:
      - name: app_id
        in: path
        description: the application id in mongo id format (ex. 5e22085d5379215be800002b)
        required: true
        type: string
      - in: body
        name: gdprPayload
        description: GDPR/CCPA request payload
        schema:
          $ref: '#/definitions/POSTGDPRRequest'
      description: Triggers GDPR/CCPA request
      operationId: postGDPRRequest
      produces:
      - application/json
      security:
      - ApiKeyAuth: []
      responses:
        '201':
          description: the request is successfully submitted
          schema:
            $ref: '#/definitions/POSTGDPRResponse'
        '400':
          description: bad request
          schema:
            $ref: '#/definitions/ErrorBadRequestResponse'
        '401':
          description: not authorized
          schema:
            $ref: '#/definitions/ErrorUnauthorizedResponse'
        '500':
          description: internal server error
          schema:
            $ref: '#/definitions/ErrorInternalErrorResponse'
  /metrics/v2/apps/{app_id}/gdpr-ccpa/requests/{request_id}:
    get:
      tags:
      - metrics
      summary: Fetches GDPR/CCPA request status
      description: Fetches GDPR/CCPA request status
      operationId: getGDPRRequest
      produces:
      - application/json
      security:
      - ApiKeyAuth: []
      parameters:
      - name: app_id
        in: path
        description: the application id in mongo id format (ex. 5e22085d5379215be800002b)
        required: true
        type: string
      - name: request_id
        in: path
        description: the id of submitted GDPR/CCPA request
        required: true
        type: string
      responses:
        '200':
          description: the gdpr/ccpa request status
          schema:
            $ref: '#/definitions/GetGDPRStatusResponse'
        '400':
          description: bad request
          schema:
            $ref: '#/definitions/ErrorBadRequestResponse'
        '401':
          description: not authorized
          schema:
            $ref: '#/definitions/ErrorUnauthorizedResponse'
        '404':
          description: not found
          schema:
            $ref: '#/definitions/ErrorNotFoundResponse'
        '500':
          description: internal server error
          schema:
            $ref: '#/definitions/ErrorInternalErrorResponse'
definitions:
  SurveyDataResponse:
    type: object
    properties:
      total:
        type: integer
        example: 12300
      survey_timeseries:
        $ref: '#/definitions/SurveyTimeDataArray'
  LoveTimeData:
    type: object
    properties:
      date:
        type: string
        description: love timeseries date interval (format YYYY-MM-DD)
        example: '2020-01-01'
      tapped_total:
        type: integer
        description: the total amount of tapped responses
        example: 20388
      tapped_love:
        type: integer
        description: The number of yes taps
        example: 15535
      tapped_no:
        type: integer
        description: The number of no taps
      other_respondents:
        type: integer
        description: The number of cancels (in Android) or non-responses
  GetGDPRStatusResponse:
    type: object
    description: GDPR/CCPA request status
    properties:
      controller_id:
        type: string
        description: name of organization triggered the request
        example: Apptentive Engineering
      expected_completion_time:
        type: string
        description: expected completion time of the gdpr/ccpa request
        example: '1984-11-01T15:00:01Z'
      subject_request_id:
        type: string
        description: id of the request
        example: a7551968-d5d6-44b2-9831-815ac9017798
      request_status:
        type: string
        description: current status of the request progress
        example: completed
      api_version:
        type: string
        description: version string representing the desired version of the OpenDSR API
        example: '2.0'
      results_url:
        type: string
        description: the URL of results for “access” request
        example: https://host/file_to_download.zip
  EventStatsRow:
    type: object
    properties:
      display_name:
        type: string
        description: the text representation of the apptentive event
        example: CustomerStart
      event_type:
        type: string
        description: the type of event
        example: custom' | apptentive
      count:
        type: number
        description: the amount of time this event was triggered for particular date range
        example: 114567
      unique_customers:
        type: number
        description: the amount of unique customers that interacted with this event
        example: 113555
      last_seen_at:
        type: string
        description: last seen date in format of YYYY-MM-DD
        example: '2020-01-01'
      archived:
        type: boolean
        description: boolean value that determines whether this event is archived by apptentive customer
  RollupResponse:
    type: object
    properties:
      app_id:
        type: string
        description: apptentive's application identifier
        example: 5e22085d5379215be800002b
      org_id:
        type: string
        description: Apptentive's customer/organization identifier
        example: 5e22085d5379215be800002b
      title:
        type: string
        description: The title of the application specified in the dashboard
        example: App Demo
      platform:
        type: string
        description: the application platform type
        example: iOS, Android, or Web
      store_id:
        type: string
        description: The identifier of the app on iTunes or Google Play
        example: com.company.product (android)
      love_ratio:
        type: string
        description: The percentage of consumers that love the experience
        example: 11%
      active_users:
        type: integer
        description: The number of distinct consumers seen within the last 30 days
        example: 12419
      current_rating:
        type: integer
        description: The current version's rating (iTunes only)
        example: 4.78
      all_rating:
        type: integer
        description: The app's all-time rating across versions
        example: 4.78
      interaction_count:
        type: integer
        description: The count of total Apptentive interaction events see within the timeframe
        example: 404152
  SurveyQuestionAnswerChoice:
    type: object
    properties:
      id:
        type: string
        description: The id of the given Answer Choice
        example: 614cb7b8a59ced06f8000055
      value:
        type: string
        description: The text of the given Answer Choice
        example: Award System
  SurveyStatsRow:
    type: object
    properties:
      id:
        type: string
        description: the hex id representation of the survey object
        example: 614cb7b8a59ced06f8000055
      active:
        type: boolean
        description: boolean value that identifies whether survey is currently active
      created_at:
        type: string
        description: the survey created date in format 'YYYY-MM-DD'
        example: '2020-01-01'
      updated_at:
        type: string
        description: the survey updated date in format 'YYYY-MM-DD'
        example: '2020-01-01'
      start_time:
        type: string
        description: the date in format YYYY-MM-DD when survey has officially launched, null if never started
        example: '2020-01-01'
      end_time:
        type: string
        description: the date in format YYYY-MM-DD when survey has officially ended, null if never ended (still active)
        example: '2020-01-01'
      response_count:
        type: number
        description: the total response count
        example: 115000
      response_rate:
        type: number
        description: the percentage of total response rate for the given survey
        example: 85.93
      name:
        type: string
        description: the name of survey
        example: My Survey
      title:
        type: string
        description: the title representation of the survey (for customers)
        example: Feature Usage Survey
      description:
        type: string
        description: the description of the survey
        example: Please let us know what do you think about our rewards
      events:
        type: array
        description: events associated with the following surveys
        items:
          type: string
          description: event name
          example: bucket-award-open
      required:
        type: boolean
        description: whether the Survey is required to be completed
        example: true
      multiple_responses:
        type: boolean
        description: whether the Survey allows the same person to complete it multiple times
        example: false
      show_success_message:
        type: boolean
        description: whether a success message is shown when the Survey is completed
        example: true
      success_message:
        type: string
        description: message displayed upon survey completion if show_success_message is true
        example: Thank you for your input.
      view_period:
        type: number
        description: minimum number of seconds between showing Survey
        example: 86400
      resp_max:
        type: number
        description: maximum number of responses allowed for the Survey
        example: 1000
      view_count:
        type: number
        description: maximum number of responses allowed for the Survey
        example: 340
      questions:
        type: array
        items:
          $ref: '#/definitions/SurveyQuestions'
        description: survey questions
  EventStatsTimeseriesRow:
    type: object
    properties:
      date:
        type: string
        description: date in 'YYYY-MM-DD' format
        example: '2022-01-01'
      event_count:
        type: number
        description: overall event count per day
        example: 10183731
      unique_customers:
        type: number
