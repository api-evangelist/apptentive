name: Apptentive
description: >-
  Apptentive, now Alchemer Mobile / Alchemer Digital, is a mobile customer engagement and
  in-app feedback platform used to run surveys, message prompts (Notes), ratings/review
  prompts, and Fan Signals inside iOS, Android, React Native, and web apps. Its public Data
  API at data.apptentive.com gives customers read-only export and analytics access to app
  metrics (active users, retention, Love Percent, Net Fan Score, ratings, reviews), survey
  and note reporting, and raw people, device, conversation, and message records, plus a
  GDPR/CCPA data-request endpoint. Authentication is an X-API-KEY header issued and scoped
  from the Alchemer Digital dashboard; the service is SOC 2 Type 2 and ISO 27001 certified.
